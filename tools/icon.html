<!doctype html><meta charset=utf-8><body style="margin:0;background:transparent">
<canvas id=c width=1024 height=1024 style="width:1024px;height:1024px"></canvas>
<script src="../src/skyline.js"></script>
<script>
/* the launcher icon: a paper-cut fractal tree, leaves above the ground line, roots below */
var c=document.getElementById('c').getContext('2d'),S=1024,P=MDSKY.paper,full=location.hash!=='#round';
c.scale(1,1);
function rr(q,x,y,w,h,r){q.beginPath();q.moveTo(x+r,y);q.arcTo(x+w,y,x+w,y+h,r);q.arcTo(x+w,y+h,x,y+h,r);q.arcTo(x,y+h,x,y,r);q.arcTo(x,y,x+w,y,r);q.closePath();}
var g=c.createLinearGradient(0,0,0,S);g.addColorStop(0,'#24507a');g.addColorStop(0.62,'#3a6a9a');g.addColorStop(0.62,'#6b4426');g.addColorStop(1,'#4a2e1a');
c.save();rr(c,0,0,S,S,location.hash==='#square'?1:full?S*0.22:S*0.5);c.clip();c.fillStyle=g;c.fillRect(0,0,S,S);
P(c,function(q){q.beginPath();q.arc(S*0.84,S*0.13,S*0.055,0,6.283);},'#f6d25a',0.6);
P(c,function(q){q.beginPath();q.moveTo(0,S*0.635);for(var x=0;x<=S;x+=16)q.lineTo(x,S*0.62-Math.cos((x/S-0.5)*Math.PI)*S*0.03);q.lineTo(S,S*0.66);q.lineTo(0,S*0.66);q.closePath();},'#5aa24e',1);
var gy=S*0.62,cx=S/2;
function seg(x,y,a,l,w,d,col){var x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();return[x2,y2];}
var leaves=[];
function tree(x,y,a,l,w,d){var e=seg(x,y,a,l,w,d,'#5a3418');if(d===0){leaves.push(e.concat(a));return;}var sp=0.42+0.05*d;tree(e[0],e[1],a-sp,l*0.74,w*0.7,d-1);tree(e[0],e[1],a+sp,l*0.74,w*0.7,d-1);}
tree(cx,gy+6,-Math.PI/2,S*0.128,S*0.048,6);
leaves.forEach(function(L,i){var col=['#f2b83a','#7ac25a','#5aa24e','#e8a02a'][i%4];P(c,function(q){var x=L[0],y=L[1],a=L[2]+(i%2?0.5:-0.5),len=S*0.05,ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len,px=-Math.sin(a)*len*0.35,py=Math.cos(a)*len*0.35;q.beginPath();q.moveTo(x,y);q.quadraticCurveTo((x+ex)/2+px,(y+ey)/2+py,ex,ey);q.quadraticCurveTo((x+ex)/2-px,(y+ey)/2-py,x,y);q.closePath();},col,0.5);});
function root(x,y,a,l,w,d){var e=seg(x,y,a,l,w,d,'#e8c890');if(d===0)return;root(e[0],e[1],a-0.45,l*0.7,w*0.65,d-1);root(e[0],e[1],a+0.45,l*0.7,w*0.65,d-1);}
root(cx,gy+S*0.03,Math.PI/2,S*0.1,S*0.035,4);
P(c,function(q){q.beginPath();q.arc(cx,S*0.78,S*0.035,0,6.283);},'#f2b83a',1);
c.restore();
</script>
