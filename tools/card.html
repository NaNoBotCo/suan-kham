<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Sarabun:wght@400;600&family=Noto+Sans+Devanagari:wght@600&family=Noto+Sans+Lao:wght@600&family=Noto+Sans+Tai+Tham:wght@600&display=swap" rel="stylesheet">
<body style="margin:0"><canvas id=c width=1200 height=630 style="width:1200px;height:630px"></canvas>
<script src="../src/skyline.js"></script><script src="../src/tree.js"></script>
<script>
var cv=document.getElementById('c'),c=cv.getContext('2d');cv.width=2400;cv.height=1260;c.scale(2,2);
Promise.all([document.fonts.load('600 80px Mitr'),document.fonts.load('600 40px Sarabun'),document.fonts.load('27px Sarabun'),document.fonts.load('600 16px "Noto Sans Devanagari"','धर्म'),document.fonts.load('600 16px "Noto Sans Tai Tham"','ᨵᩢ'),document.fonts.load('600 16px "Noto Sans Lao"','ທຳ')]).then(()=>fetch('../data/heads/tham.json')).then(r=>r.json()).then(function(h){
  c.fillStyle='#f6f0e2';c.fillRect(0,0,1200,630);
  c.save();c.beginPath();c.rect(560,30,610,570);c.clip();c.translate(560,30);MDTREE.draw(c,610,570,4200,h,{sky:true,roots:true});c.restore();
  c.fillStyle='#9a2a1f';c.font='600 112px Mitr';c.fillText('สวนคำ',60,200);
  c.fillStyle='#23180f';c.font='600 46px Sarabun';c.fillText('The Word Garden',64,268);
  c.font='27px Sarabun';c.fillStyle='#5e4a38';
  ['180 Thai words grown as fractal trees.','A branch is a sense, a leaf a compound,','the roots their cousins and ancestors.'].forEach((l,i)=>c.fillText(l,64,350+i*44));
  c.font='500 34px Mitr';c.fillStyle='#2f7a46';c.fillText('ใบหนึ่ง = คำหนึ่ง',64,540);
  document.title='ready';
});
</script>
