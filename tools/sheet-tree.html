<!doctype html><meta charset=utf-8><body style="margin:0;background:#f6f2e9">
<canvas id=c width=1400 height=1000></canvas>
<script src="../src/skyline.js"></script><script src="../src/tree.js"></script>
<script>
var c=document.getElementById("c").getContext("2d");
Promise.all(['hua','nam','pha-sa','ta'].map(s=>fetch('../data/heads/'+s+'.json').then(r=>r.json()))).then(function(H){
 var t=+(location.hash.slice(1)||1234);
 H.forEach(function(h,i){c.save();c.translate((i%2)*700,Math.floor(i/2)*500);c.beginPath();c.rect(0,0,690,490);c.clip();MDTREE.draw(c,690,490,t,h,{sky:true,hi:i==0?3:null});c.restore();});
});
</script>
